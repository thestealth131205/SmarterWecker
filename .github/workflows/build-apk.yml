name: Android APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'wear/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'Nocturn-Kalender/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'wear/**'
      - 'Nocturn-Kalender/**'
  workflow_dispatch:

jobs:
  android:
    name: Android-APKs bauen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: Debug-APK bauen
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: WearOS-Begleit-App bauen
        # Debug-Build statt Release: automatisch mit dem Debug-Keystore signiert und damit direkt
        # per ADB auf die Uhr sideloadbar — eine eigene Release-Signierung lohnt für diese kleine,
        # nicht im Play Store vertriebene Begleit-App nicht (siehe CLAUDE.md "keine Play-Store-
        # Veröffentlichung").
        run: ./gradlew :wear:assembleDebug --no-daemon

      - name: Release-Keystore einrichten
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore.p12

      - name: Release-APK bauen (signiert)
        if: github.event_name != 'pull_request'
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          RELEASE_KEYSTORE_PATH: keystore/release.keystore.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Release-APK bauen (unsigned, Pull Requests)
        if: github.event_name == 'pull_request'
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nocturn-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Release-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nocturn-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: WearOS-Begleit-App hochladen
        uses: actions/upload-artifact@v4
        with:
          name: nocturn-watch-${{ github.run_number }}
          path: wear/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Versionsname auslesen
        if: github.event_name != 'pull_request'
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

  nextcloud-kalender:
    name: NocTurn-Kalender-App (Nextcloud) bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nocturn-Kalender

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'Nocturn-Kalender/package-lock.json'

      - name: PHP 8.2 einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Composer-Abhängigkeiten installieren
        run: composer install --no-dev --prefer-dist --no-progress

      - name: npm-Abhängigkeiten installieren
        run: npm ci

      - name: Frontend bauen (rspack production)
        run: npm run build

      - name: App-Paket (für Nextcloud-Installation) packen
        if: github.event_name != 'pull_request'
        id: package
        run: |
          APP_ID=calendar
          VERSION=$(grep -oP '<version>\K[^<]+' appinfo/info.xml)
          BUILD_DIR="$RUNNER_TEMP/nc-app-build"
          PKG_DIR="$BUILD_DIR/$APP_ID"
          mkdir -p "$PKG_DIR"
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='tests' \
            --exclude='playwright*' --exclude='screenshots' \
            ./ "$PKG_DIR/"
          OUT_FILE="$RUNNER_TEMP/nocturn-kalender-${VERSION}.tar.gz"
          tar -czf "$OUT_FILE" -C "$BUILD_DIR" "$APP_ID"
          echo "path=$OUT_FILE" >> "$GITHUB_OUTPUT"

      - name: App-Paket hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-kalender-app-${{ github.run_number }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 30

  release:
    name: GitHub Release veröffentlichen
    needs: [ android, nextcloud-kalender ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Release-APK herunterladen
        uses: actions/download-artifact@v4
        with:
          name: nocturn-release-${{ github.run_number }}
          path: artifacts/release-apk

      - name: WearOS-APK herunterladen
        uses: actions/download-artifact@v4
        with:
          name: nocturn-watch-${{ github.run_number }}
          path: artifacts/watch-apk

      - name: NocTurn-Kalender-Paket herunterladen
        uses: actions/download-artifact@v4
        with:
          name: nextcloud-kalender-app-${{ github.run_number }}
          path: artifacts/nextcloud-kalender

      - name: GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android.outputs.version }}-${{ github.run_number }}
          name: NocTurn ${{ needs.android.outputs.version }} (Build ${{ github.run_number }})
          files: |
            artifacts/release-apk/*.apk
            artifacts/watch-apk/*.apk
            artifacts/nextcloud-kalender/*.tar.gz
          generate_release_notes: true
